<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>11 月 14 日（六）CLC受洗禮拜服事說明</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="CLC受洗服事說明" />
  <meta name="theme-color" content="#007a87" />
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-subtle: #fbfbfd;
      --surface-elevated: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #515154;
      --text-tertiary: #6e6e73;
      --accent: #0071e3;
      --accent-soft: rgba(0, 113, 227, 0.1);
      --sister: #d93865;
      --sister-soft: rgba(217, 56, 101, 0.11);
      --brother: #0066cc;
      --brother-soft: rgba(0, 102, 204, 0.11);
      --olive: #6c7a1e;
      --olive-soft: rgba(108, 122, 30, 0.13);
      --red-team: #c92a2a;
      --red-team-soft: rgba(201, 42, 42, 0.11);
      --border: rgba(0, 0, 0, 0.22);
      --header-bg: rgba(245, 245, 247, 0.88);
      --seg-bg: rgba(118, 118, 128, 0.14);
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.08);
      --modal-border: #0071e3;
      --shadow-modal: 0 24px 64px rgba(0, 0, 0, 0.34), 0 0 0 1px rgba(0, 113, 227, 0.25);
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    [data-theme="dark"] {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-subtle: #2c2c2e;
      --surface-elevated: #2c2c2e;
      --text-primary: #f5f5f7;
      --text-secondary: #c7c7cc;
      --text-tertiary: #98989d;
      --accent: #0a84ff;
      --accent-soft: rgba(10, 132, 255, 0.18);
      --sister: #ff375f;
      --sister-soft: rgba(255, 55, 95, 0.18);
      --brother: #409cff;
      --brother-soft: rgba(64, 156, 255, 0.18);
      --olive: #9fb336;
      --olive-soft: rgba(159, 179, 54, 0.2);
      --red-team: #ff453a;
      --red-team-soft: rgba(255, 69, 58, 0.18);
      --border: rgba(255, 255, 255, 0.24);
      --header-bg: rgba(28, 28, 30, 0.88);
      --seg-bg: rgba(118, 118, 128, 0.26);
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.5);
      --modal-border: #3898ff;
      --shadow-modal: 0 24px 70px rgba(0, 0, 0, 0.88), 0 0 0 1px rgba(56, 152, 255, 0.45);
    }

    /* Hide all scrollbars globally while keeping smooth scrolling */
    html, body, .svg-frame, .modal-card, .map-selector, .filter-pills {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    .svg-frame::-webkit-scrollbar,
    .modal-card::-webkit-scrollbar,
    .map-selector::-webkit-scrollbar,
    .filter-pills::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Minimum font-size enforced >= 10pt (13.33px -> smallest text is 14px / 10.5pt) */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 16.5px;
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
      overflow-x: hidden;
    }

    /* Sticky Apple-style Glass Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1.5px solid var(--border);
      transition: background-color 0.25s ease;
    }

    .header-inner {
      max-width: 1020px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .top-bar-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title-row {
      text-align: left;
    }

    @media (min-width: 600px) {
      .title-row {
        text-align: center;
        flex: 1;
        padding-left: 96px;
      }
    }

    .eyebrow {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--accent);
      margin-bottom: 2px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    /* Theme Toggle Button (Light / Dark) */
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, background-color 0.25s ease;
      flex-shrink: 0;
    }

    .theme-toggle:active {
      transform: scale(0.96);
    }

    /* Segmented Control */
    .segmented-control {
      display: inline-flex;
      background: var(--seg-bg);
      padding: 4px;
      border-radius: 999px;
      width: 100%;
      max-width: 460px;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 15.5px;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .tab-btn.active {
      background: var(--surface-elevated);
      color: var(--text-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    main {
      max-width: 1020px;
      margin: 0 auto;
      padding: 18px 18px 60px;
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.28s ease;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Clean Search Bar */
    .quick-bar {
      margin-bottom: 16px;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 16px;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.25s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 16px;
      pointer-events: none;
    }

    /* Callout Card (Essential Schedule / Core Info Only) */
    .callout-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 15px 18px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .callout-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .callout-text strong {
      display: block;
      font-size: 17px;
      color: var(--text-primary);
    }

    .callout-text span {
      display: block;
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Section Header */
    .section-header {
      margin: 22px 0 12px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.015em;
      margin: 0;
    }

    /* Worker Roster Grid */
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 12px;
    }

    .worker-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 16px;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      text-align: left;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s, background-color 0.25s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .worker-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent);
    }

    .worker-card:active {
      transform: scale(0.98);
    }

    .card-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pos-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      width: fit-content;
    }

    .pos-pill.blue { background: var(--brother-soft); color: var(--brother); }
    .pos-pill.red { background: var(--red-team-soft); color: var(--red-team); }
    .pos-pill.olive { background: var(--olive-soft); color: var(--olive); }
    .pos-pill.pink { background: var(--sister-soft); color: var(--sister); }

    .dual-tag {
      font-size: 14px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .worker-name {
      font-size: 21px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .worker-preview {
      font-size: 14.5px;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.45;
    }

    /* Vector Diagram Container Card */
    .diagram-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 16px;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
    }

    .diagram-top {
      margin-bottom: 12px;
    }

    .diagram-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0;
    }

    .svg-frame {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      overflow-x: auto;
    }

    .svg-frame svg {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .map-hotlink {
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), filter 0.18s ease;
      transform-box: fill-box;
      transform-origin: center;
    }

    .map-hotlink:hover {
      transform: scale(1.06);
      filter: drop-shadow(0 3px 8px rgba(0, 113, 227, 0.35));
    }

    .map-hotlink:active {
      transform: scale(0.96);
    }

    .map-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .map-chip {
      border: 1.5px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .map-chip.active, .map-chip:hover {
      background: var(--text-primary);
      color: var(--bg);
      border-color: var(--text-primary);
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .filter-pill {
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-pill.active {
      background: var(--text-primary);
      color: var(--bg);
      border-color: var(--text-primary);
    }

    .two-col-diagrams {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 820px) {
      .two-col-diagrams {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* ==================== POP-UP MODAL ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 10px;
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    .modal-backdrop.open {
      display: flex;
      opacity: 1;
    }

    .modal-card {
      background: var(--surface);
      width: calc(100vw - 20px);
      max-width: 680px;
      height: calc(100vh - 24px);
      max-height: 94vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 0 18px 26px;
      border: 2.5px solid var(--modal-border);
      box-shadow: var(--shadow-modal);
      transform: scale(0.95) translateY(10px);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        padding: 20px;
      }
      .modal-card {
        width: 94vw;
        height: auto;
        max-height: 90vh;
        padding: 0 26px 28px;
      }
    }

    .modal-backdrop.open .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-top {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 18px 0 12px;
      margin-bottom: 14px;
      border-bottom: 1.5px solid var(--border);
    }

    @media (min-width: 640px) {
      .modal-top {
        padding-top: 22px;
      }
    }

    .modal-header-main {
      flex: 1;
      min-width: 0;
    }

    .modal-badge-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cross-role-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1.5px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cross-role-btn:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .modal-close {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-primary);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }
    .modal-close:active {
      transform: scale(0.94);
    }

    .modal-title {
      margin: 7px 0 2px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .modal-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
    }

    .detail-block {
      background: var(--bg);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1.5px solid var(--border);
    }

    .detail-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 16.5px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.55;
    }

    .detail-list {
      margin: 0;
      padding-left: 18px;
      font-size: 16.5px;
      color: var(--text-primary);
    }

    .detail-list li {
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .multi-worker-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .multi-worker-btn {
      flex: 1;
      padding: 8px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .multi-worker-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .modal-svg-box {
      margin-top: 10px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: #ffffff;
      overflow: hidden;
    }

    .modal-svg-inner {
      padding: 10px;
      background: #ffffff;
    }

    .modal-svg-inner svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .route-group {
      transition: opacity 0.25s ease;
    }
    .dimmed .route-group {
      opacity: 0.16;
    }
    .dimmed .route-group.highlighted {
      opacity: 1;
    }

    footer {
      text-align: center;
      padding: 18px 16px 36px;
      font-size: 14px;
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="top-bar-row">
        <div class="title-row">
          <div class="eyebrow">11 月 14 日（六）</div>
          <h1>CLC受洗禮拜服事說明</h1>
        </div>
        <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" aria-label="切換深色或淺色模式">
          <span id="themeIcon">🌙</span>
          <span id="themeText">深色模式</span>
        </button>
      </div>

      <div class="segmented-control" role="tablist" aria-label="服事分頁切換">
        <button class="tab-btn active" id="tab-reception" role="tab" aria-selected="true" onclick="switchTab('reception')">
          受洗招待服事同工
        </button>
        <button class="tab-btn" id="tab-communion" role="tab" aria-selected="false" onclick="switchTab('communion')">
          聖餐服事同工
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Clean Search Box Only -->
    <div class="quick-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" placeholder="搜尋姓名或位置（如：楊艾倫、招待A、位置 1）" oninput="handleSearch(this.value)" />
      </div>
    </div>

    <!-- ==================== PAGE 1: 受洗招待服事同工 ==================== -->
    <section id="panel-reception" class="tab-panel active" role="tabpanel">
      <div class="callout-card">
        <div class="callout-icon">⏰</div>
        <div class="callout-text">
          <strong>招待通告：8:30 集合，9:20 招待就定位</strong>
        </div>
      </div>

      <!-- Floor Plans First -->
      <div class="two-col-diagrams">
        <div class="diagram-card">
          <div class="diagram-top">
            <h3 class="diagram-title">姊妹招待站位圖（女1 ～ 女4）</h3>
          </div>
          <div class="svg-frame" id="main-sister-svg-container"></div>
        </div>

        <div class="diagram-card">
          <div class="diagram-top">
            <h3 class="diagram-title">弟兄招待站位圖（男1 ～ 男8）</h3>
          </div>
          <div class="svg-frame" id="main-brother-svg-container"></div>
        </div>
      </div>

      <!-- Reception Workers Below -->
      <div class="section-header">
        <h2 class="section-title">受洗招待服事同工名單</h2>
      </div>

      <div class="filter-pills">
        <button class="filter-pill active" onclick="filterReception('all', this)">全部招待 (12位)</button>
        <button class="filter-pill" onclick="filterReception('sister', this)">姊妹招待 (招待A～D)</button>
        <button class="filter-pill" onclick="filterReception('brother', this)">弟兄招待 (招待1～8)</button>
      </div>

      <div id="sister-section">
        <div class="section-header">

    function findDualRole(workerName, currentType) {
      if (currentType === "reception") {
        const match = communionWorkers.find(w => w.name === workerName);
        return match ? { worker: match, type: "communion" } : null;
      } else {
        const match = receptionWorkers.find(w => w.name === workerName);
        return match ? { worker: match, type: "reception" } : null;
      }
    }

    function openCommunionByNum(numStr) {
      const worker = communionWorkers.find(w => w.num === String(numStr));
      if (worker) openWorkerModal(worker, "communion");
    }

    function openReceptionByCode(codeStr) {
      const worker = receptionWorkers.find(w => w.code === codeStr);
      if (worker) openWorkerModal(worker, "reception");
    }

    // =========================================================================
    // 3. VECTOR SVG GENERATORS (ALL TEXT >= 14px / 10.5pt)

    function drawChairBlock(x, y, rows, cols, cellW, cellH, gapX, gapY, angle = 0) {
      let out = `<g transform="translate(${x},${y}) rotate(${angle})">`;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cx = c * (cellW + gapX);
          const cy = r * (cellH + gapY);
          out += `<rect x="${cx}" y="${cy}" width="${cellW}" height="${cellH}" rx="2" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>`;
        }
      }
      out += `</g>`;
      return out;
    }

    // =========================================================================
    // 4. THEME SWITCHER
    // =========================================================================
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      const iconEl = document.getElementById("themeIcon");
      const textEl = document.getElementById("themeText");
      if (theme === "dark") {
        iconEl.textContent = "☀️";
        textEl.textContent = "淺色模式";
      } else {
        iconEl.textContent = "🌙";
        textEl.textContent = "深色模式";
      }
      try {
        localStorage.setItem("clc-baptism-theme", theme);
      } catch (e) {}
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      applyTheme(current === "light" ? "dark" : "light");
    }

    function initTheme() {
      let saved = null;
      try {
        saved = localStorage.getItem("clc-baptism-theme");
      } catch (e) {}
      if (saved === "dark" || saved === "light") {
        applyTheme(saved);
      } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        applyTheme("dark");
      } else {
        applyTheme("light");
      }
    }

    // =========================================================================
    // 5. UI RENDERING & INTERACTIONS
    // =========================================================================
    function createWorkerCard(worker, type) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "worker-card";
      card.setAttribute("data-search", `${worker.position} ${worker.name} ${worker.summary}`);
      card.onclick = () => openWorkerModal(worker, type);

      const dual = findDualRole(worker.name, type);
      const dualBadge = dual
        ? `<span class="dual-tag">${dual.type === "communion" ? "+聖餐" : "+招待"}</span>`
        : "";

      card.innerHTML = `
        <div>
          <div class="card-badge-row">
            <span class="pos-pill ${worker.pillClass}">${worker.position}</span>
            ${dualBadge}
          </div>
          <div class="worker-name" style="margin-top:8px;">${worker.name}</div>
        </div>
        <div class="worker-preview">${worker.summary}</div>
      `;
      return card;
    }

    function renderAll() {
      const communionGrid = document.getElementById("communion-grid");
      communionWorkers.forEach(w => communionGrid.appendChild(createWorkerCard(w, "communion")));

      const sisterGrid = document.getElementById("sister-grid");
      const brotherGrid = document.getElementById("brother-grid");
      receptionWorkers.forEach(w => {
        if (w.category === "sister") {
          sisterGrid.appendChild(createWorkerCard(w, "reception"));
        } else {
          brotherGrid.appendChild(createWorkerCard(w, "reception"));
        }
      });

      document.getElementById("main-communion-svg-container").innerHTML = buildCommunionSVG('all', true);
      document.getElementById("main-sister-svg-container").innerHTML = buildSisterSVG(null, true);
      document.getElementById("main-brother-svg-container").innerHTML = buildBrotherSVG(null, true);
    }

    function highlightCommunionRoute(num, btnEl) {
      document.querySelectorAll("#communion-map-filter .map-chip").forEach(b => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");
      document.getElementById("main-communion-svg-container").innerHTML = buildCommunionSVG(num, true);
    }

    function switchTab(tabName) {
      const tabReception = document.getElementById("tab-reception");
      const tabCommunion = document.getElementById("tab-communion");
      const panelReception = document.getElementById("panel-reception");
      const panelCommunion = document.getElementById("panel-communion");

      if (tabName === "reception") {
        tabReception.classList.add("active");
        tabReception.setAttribute("aria-selected", "true");
        tabCommunion.classList.remove("active");
        tabCommunion.setAttribute("aria-selected", "false");
        panelReception.classList.add("active");
        panelCommunion.classList.remove("active");
      } else {
        tabCommunion.classList.add("active");
        tabCommunion.setAttribute("aria-selected", "true");
        tabReception.classList.remove("active");
        tabReception.setAttribute("aria-selected", "false");
        panelCommunion.classList.add("active");
        panelReception.classList.remove("active");
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function filterReception(category, btnEl) {
      document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
      btnEl.classList.add("active");

      const sisterSec = document.getElementById("sister-section");
      const brotherSec = document.getElementById("brother-section");

      if (category === "all") {
        sisterSec.style.display = "block";
        brotherSec.style.display = "block";
      } else if (category === "sister") {
        sisterSec.style.display = "block";
        brotherSec.style.display = "none";
      } else {
        sisterSec.style.display = "none";
        brotherSec.style.display = "block";
      }
    }

    function handleSearch(query) {
      const q = query.trim().toLowerCase();
      document.querySelectorAll(".worker-card").forEach(card => {
        const text = card.getAttribute("data-search").toLowerCase();
        card.style.display = text.includes(q) ? "flex" : "none";
      });
    }

    function openWorkerModal(worker, type) {
      const modal = document.getElementById("detailModal");
      const badgeBar = document.getElementById("modalBadgeBar");
      const nameEl = document.getElementById("modalWorkerName");
      const subEl = document.getElementById("modalRoleSubtitle");
      const bodyEl = document.getElementById("modalBody");

      const dual = findDualRole(worker.name, type);
      let switchBtnHtml = "";
      if (dual) {
        const label = dual.type === "communion"
          ? `🍞 聖餐服事（${dual.worker.position}）`
          : `🤝 招待服事（${dual.worker.position}）`;
        switchBtnHtml = `<button type="button" class="cross-role-btn" id="crossRoleSwitchBtn">${label}</button>`;
      }

      badgeBar.innerHTML = `
        <span class="pos-pill ${worker.pillClass}">${worker.position}</span>
        ${switchBtnHtml}
      `;

      if (dual) {
        const btn = document.getElementById("crossRoleSwitchBtn");
        if (btn) {
          btn.onclick = () => {
            openWorkerModal(dual.worker, dual.type);
            document.querySelector(".modal-card").scrollTo({ top: 0, behavior: "smooth" });
          };
        }
      }

      nameEl.textContent = worker.name;
      subEl.textContent = worker.group;

      if (type === "communion") {
        const tasksHtml = worker.tasks.map(t => `<li>${t}</li>`).join("");
        bodyEl.innerHTML = `
          <div class="detail-block">
            <div class="detail-label">聖餐服事內容</div>
            <ul class="detail-list">${tasksHtml}</ul>
          </div>
          <div class="detail-block">
            <div class="detail-label">現場原則</div>
            <div class="detail-value">${worker.note}</div>
          </div>
          <div class="modal-svg-box">
            <div class="modal-svg-inner">${buildCommunionSVG(worker.num, false)}</div>
          </div>
        `;
      } else {
        const mapSvg = worker.category === "sister"
          ? buildSisterSVG(worker.code, false)
          : buildBrotherSVG(worker.code, false);

        let multiPickerHtml = "";
        if (["男6", "男7", "男8"].includes(worker.code)) {
          const corridorGroup = receptionWorkers.filter(w => ["男6", "男7", "男8"].includes(w.code));
          multiPickerHtml = `
            <div class="multi-worker-tabs">
              ${corridorGroup.map(w => `
                <button type="button" class="multi-worker-btn ${w.code === worker.code ? 'active' : ''}"
                  onclick="openReceptionByCode('${w.code}')">
                  ${w.code} ${w.name}
                </button>
              `).join('')}
            </div>
          `;
        }

        bodyEl.innerHTML = `
          ${multiPickerHtml}
          <div class="detail-block">
            <div class="detail-label">第一階段 · 報到 / 場地預備</div>
            <div class="detail-value">${worker.stage1}</div>
          </div>
          <div class="detail-block">
            <div class="detail-label">第二階段 · 受洗開始後任務</div>
            <div class="detail-value">${worker.stage2}</div>
          </div>
          <div class="modal-svg-box">
            <div class="modal-svg-inner">${mapSvg}</div>
          </div>
        `;
      }

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      const modal = document.getElementById("detailModal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === "detailModal") closeModal();
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    initTheme();
    renderAll();
  </script>
